[package]
name = "lance-conversion"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "lance_conversion"
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
arrow-array = { version = "58", features = ["ffi"] }
arrow-cast = "58"
arrow-schema = { version = "58", features = ["ffi"] }
bytes = "1"
datafusion-physical-plan = "54"
futures = "0.3"
lance = { git = "https://github.com/lance-format/lance.git", rev = "f3dc9364c07d6e84706e1f07a9a0654b4ec480f1", default-features = false }
lance-index = { git = "https://github.com/lance-format/lance.git", rev = "f3dc9364c07d6e84706e1f07a9a0654b4ec480f1" }
lance-io = { git = "https://github.com/lance-format/lance.git", rev = "f3dc9364c07d6e84706e1f07a9a0654b4ec480f1", default-features = false }
lance-linalg = { git = "https://github.com/lance-format/lance.git", rev = "f3dc9364c07d6e84706e1f07a9a0654b4ec480f1" }
object_store = "0.14"
object_store_opendal = { version = "0.59", features = ["services-s3"] }
libflate = "1"
opendal = { version = "0.58", default-features = false, features = ["executors-tokio", "http-transport-reqwest", "services-fs", "services-hf", "services-s3"] }
opendal-http-transport-reqwest = "0.58"
parquet = { version = "58", features = ["arrow", "async"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "fs", "sync"] }
tokio-util = { version = "0.7", features = ["compat", "io-util"] }
thiserror = "2"
url = "2"
warc = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }
arrow-select = "58"
tempfile = "3"

[profile.dev]
debug = 0

[profile.release]
debug = 0
