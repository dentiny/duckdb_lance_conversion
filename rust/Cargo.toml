[package]
name = "lance-conversion"
version = "0.2.1"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "lance_conversion"
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
atif-arrow = "0.4.5"
atif-io = "0.4.5"
arrow-array = { version = "59", features = ["ffi"] }
arrow-cast = "59"
arrow-schema = { version = "59", features = ["ffi"] }
bytes = "1"
base64 = "0.23"
datafusion-physical-plan = "55"
futures = "0.3"
flate2 = { version = "1", default-features = false, features = ["zlib-ng"] }
lance = { git = "https://github.com/lance-format/lance.git", rev = "78916cdae92080c83cbd6d8fb5f9137c09af94ae", default-features = false }
lance-index = { git = "https://github.com/lance-format/lance.git", rev = "78916cdae92080c83cbd6d8fb5f9137c09af94ae" }
lance-io = { git = "https://github.com/lance-format/lance.git", rev = "78916cdae92080c83cbd6d8fb5f9137c09af94ae", default-features = false }
lance-linalg = { git = "https://github.com/lance-format/lance.git", rev = "78916cdae92080c83cbd6d8fb5f9137c09af94ae" }
object_store = "0.14"
object_store_opendal = "0.60"
opendal = { version = "0.59.3", default-features = false, features = ["executors-tokio", "http-transport-reqwest", "layers-retry", "layers-timeout", "services-fs", "services-hf", "services-http", "services-s3"] }
opendal-http-transport-reqwest = "0.59"
parquet = { version = "59", features = ["arrow", "arrow_canonical_extension_types", "async"] }
percent-encoding = "2"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "fs", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
warc-rs = "0.3.2"

[dev-dependencies]
png = "0.18"
hound = "3.5"
tokio = { version = "1", features = ["io-util", "macros"] }
arrow-select = "59"
tempfile = "3"

[profile.dev]
debug = 0

[profile.release]
debug = 0
