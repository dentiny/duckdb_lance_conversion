[package]
name = "lance-conversion"
version = "0.1.2"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "lance_conversion"
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
arrow-array = { version = "58", features = ["ffi"] }
arrow-cast = "58"
arrow-schema = { version = "58", features = ["ffi"] }
bytes = "1"
datafusion-physical-plan = "54"
futures = "0.3"
flate2 = { version = "1", default-features = false, features = ["zlib-ng"] }
lance = { git = "https://github.com/lance-format/lance.git", rev = "b94b20c785caadc3c95239af0108eaed8b35a118", default-features = false }
lance-index = { git = "https://github.com/lance-format/lance.git", rev = "b94b20c785caadc3c95239af0108eaed8b35a118" }
lance-io = { git = "https://github.com/lance-format/lance.git", rev = "b94b20c785caadc3c95239af0108eaed8b35a118", default-features = false }
lance-linalg = { git = "https://github.com/lance-format/lance.git", rev = "b94b20c785caadc3c95239af0108eaed8b35a118" }
object_store = "0.14"
object_store_opendal = "0.60"
opendal = { version = "0.59.3", default-features = false, features = ["executors-tokio", "http-transport-reqwest", "layers-retry", "layers-timeout", "services-fs", "services-http", "services-s3"] }
opendal-http-transport-reqwest = "0.59"
parquet = { version = "58", features = ["arrow", "arrow_canonical_extension_types", "async"] }
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "fs", "sync"] }
tokio-util = { version = "0.7", features = ["compat", "io-util", "rt"] }
thiserror = "2"
url = "2"
warc = { version = "0.4", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }
arrow-select = "58"
tempfile = "3"

[profile.dev]
debug = 0

[profile.release]
debug = 0
